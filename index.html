<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="littlewei 的公开论文阅读索引：保存机制、证据与判断。" />
    <meta name="author" content="littlewei" />
    <meta name="theme-color" content="#eceef5" />
    <title>Paper Notes — littlewei 的研究索引</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous" defer></script>
    <script src="assets/papers.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Paper Notes 首页">
        <span class="brand-mark" aria-hidden="true">PN/</span>
        <span>Paper Notes</span>
      </a>
      <div class="header-actions">
        <span class="owner-label">littlewei · public index</span>
        <span class="last-updated" id="last-updated"></span>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="切换明暗主题">◐</button>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">A WORKING INDEX OF IDEAS</p>
        <h1 id="page-title">读论文，<br /><em>留下自己的判断。</em></h1>
        <p class="hero-copy">这里不囤链接。每条记录只保留机制、证据、疑问，以及值得带走的下一步。</p>

        <dl class="stats" aria-label="阅读统计">
          <div><dt id="stat-papers">0</dt><dd>公开条目</dd></div>
          <div><dt id="stat-tags">0</dt><dd>索引标签</dd></div>
          <div><dt id="stat-days">0</dt><dd>阅读日期</dd></div>
        </dl>
      </section>

      <section class="library" aria-labelledby="library-title">
        <div class="section-heading">
          <div>
            <p class="section-index">OPEN NOTEBOOK / INDEX</p>
            <h2 id="library-title">公开笔记</h2>
          </div>
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="搜索题目、标签或判断…" autocomplete="off" />
            <kbd>/</kbd>
          </label>
        </div>

        <div class="filters">
          <div class="tag-list" id="tag-list" aria-label="按标签筛选"></div>
          <label class="sort-control">排序
            <select id="sort-select">
              <option value="newest">最近阅读</option>
              <option value="title">标题 A–Z</option>
            </select>
          </label>
        </div>

        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="paper-grid" id="paper-grid"></div>
        <div class="empty-state" id="empty-state" hidden>
          <span>∅</span>
          <h3>没有匹配的记录</h3>
          <p>换个关键词或清除标签试试。</p>
          <button type="button" id="clear-filters">清除筛选</button>
        </div>
      </section>
    </main>

    <footer>
      <p>Paper Notes / littlewei / 2026</p>
      <div class="footer-meta">
        <p>每篇笔记单独标注来源、许可与分享边界。</p>
      </div>
    </footer>

    <dialog id="paper-dialog" aria-labelledby="dialog-title">
      <div class="reader-toolbar" aria-label="阅读工具">
        <button class="reader-action" id="reader-fullscreen" type="button" aria-pressed="false">全窗口阅读</button>
        <button class="reader-action" id="reader-copy-link" type="button">复制链接</button>
        <button class="reader-action" id="reader-copy-citation" type="button">复制引用</button>
        <a class="reader-action" id="reader-download-markdown" href="#" download>下载 Markdown</a>
        <button class="reader-action" id="reader-print" type="button">打印 / PDF</button>
        <button class="dialog-close" id="dialog-close" type="button" aria-label="关闭详情">×</button>
      </div>
      <div class="reader-shell">
        <article class="paper-detail">
          <details class="mobile-toc" id="mobile-toc">
            <summary>本文目录</summary>
            <nav id="mobile-toc-body" aria-label="本文目录"></nav>
          </details>
          <div id="dialog-content"></div>
        </article>
        <aside class="desktop-toc-panel" aria-label="本文目录">
          <p class="toc-label">ON THIS PAGE</p>
          <nav id="desktop-toc"></nav>
        </aside>
      </div>
      <div class="reader-toast" id="reader-toast" role="status" aria-live="polite"></div>
    </dialog>

    <dialog class="image-dialog" id="image-dialog" aria-labelledby="image-dialog-caption">
      <button class="dialog-close image-dialog-close" id="image-dialog-close" type="button" aria-label="关闭图片">×</button>
      <figure>
        <img id="image-dialog-image" alt="" />
        <figcaption id="image-dialog-caption"></figcaption>
      </figure>
    </dialog>

    <noscript>这个网站需要 JavaScript 才能展示论文记录。</noscript>
  </body>
</html>
